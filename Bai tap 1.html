<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            table{
                margin: auto;
            }

            th{
                color: blue;
                font-size: 25px;
            }

            td{
                font-size: 14px;
            }

            tr:nth-child(2){
                background-color: rgb(150, 223, 241);
            }

            tr:nth-child(3){
                background-color: rgb(150, 223, 241);
            }        

            tr:nth-child(4){
                background-color: rgb(150, 223, 241);
            }

            tr:nth-child(2):hover{
                background-color: rgb(241, 64, 64);
            }

            tr:nth-child(3):hover{
                background-color: rgb(33, 244, 0);
            }

            tr:nth-child(4):hover{
                background-color: rgb(254, 7, 135);
            }


        </style>
        <title> Danh sách học bổng </title>
        <meta name="robots" content="noindex">
        <meta name="googlebot" content="noindex">
        
    </head>

        <table border="1">

                <td> Kiều Thị Thu Hằng </td>

            <tr>

        <img src="http://webcoban.vn/image/face.png" style="width: 200px">

</html>
